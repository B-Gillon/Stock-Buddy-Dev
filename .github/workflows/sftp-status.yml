# Hourly jobs for Stock Buddy Dev: SFTP file check and PO acknowledgement reminders.
# Needs two repository secrets: DEV_APP_URL (https://stock-buddy-dev.brandongillon.com) and CRON_SECRET.
name: Hourly jobs
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.DEV_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: SFTP status check
        run: |
          curl --fail-with-body -sS -X POST "$APP_URL/api/cron/sftp-status" \
            -H "Authorization: Bearer $CRON_SECRET"
      - name: Acknowledgement reminders
        if: always()
        run: |
          curl --fail-with-body -sS -X POST "$APP_URL/api/cron/ack-reminders" \
            -H "Authorization: Bearer $CRON_SECRET"
